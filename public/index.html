<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fNARS - Web REPL</title>
  <style>
    :root {
      --bg: #1a1b26;
      --surface: #24283b;
      --border: #3b4261;
      --text: #c0caf5;
      --text-dim: #565f89;
      --accent: #7aa2f7;
      --green: #9ece6a;
      --yellow: #e0af68;
      --red: #f7768e;
      --cyan: #7dcfff;
      --mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
    }
    .examples {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    button {
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    #output div { white-space: pre-wrap; word-break: break-all; }
    .input-line { color: var(--text-dim); }
    .input-echo-line { color: var(--text); }
    .exe-line { color: var(--green); font-weight: 600; }
    .derived-line { color: var(--cyan); }
    .answer-line { color: var(--yellow); font-weight: 600; }
    .output-line { color: var(--text); }
    .input-bar {
      display: flex;
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      gap: 8px;
      background: var(--surface);
    }
    .prompt {
      color: var(--accent);
      font-size: 14px;
      line-height: 32px;
      user-select: none;
    }
    #input {
      flex: 1;
      font-family: var(--mono);
      font-size: 14px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #submit {
      font-size: 13px;
      padding: 4px 16px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      font-weight: 600;
    }
    #submit:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <header>
    <h1>fNARS</h1>
    <div class="examples">
      <button id="ex-deduction">Deduction</button>
      <button id="ex-conditioning">Conditioning</button>
      <button id="ex-reset">Reset</button>
    </div>
  </header>
  <div id="output"></div>
  <div class="input-bar">
    <span class="prompt">&gt;&gt;</span>
    <input id="input" type="text" placeholder="Enter Narsese..." autocomplete="off" spellcheck="false">
    <button id="submit">Send</button>
  </div>
  <script src="js/fnars-browser.js"></script>
  <script>fNARS.browser.init();</script>
</body>
</html>
